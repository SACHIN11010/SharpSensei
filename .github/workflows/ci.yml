name: CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The project is a zero-dependency static site, so there is nothing to
      # install. `lint` syntax-checks the JS sources and the generated bundle.
      - name: Lint (syntax check)
        run: npm run lint

      - name: Build bundle
        run: npm run build

      # Guard: the committed js/bundle.js must match a fresh build from the
      # sources. This is what prevents the bundle from silently drifting.
      - name: Verify bundle is in sync with sources
        run: git diff --exit-code js/bundle.js
